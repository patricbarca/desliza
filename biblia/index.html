:root{

  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121916;--surface:#1B2420;--fg:#E4E9E4;--muted:#93A29B;--line:#2C3833;--accent:#8CC4AF;--on-accent:#0F1613;--glow:#D9B861;
  --glass:rgba(255,255,255,.07);--glass-edge:rgba(255,255,255,.16);--glass-hi:inset 0 1px 0 rgba(255,255,255,.22);--glass-shadow:0 12px 36px rgba(0,0,0,.45);

  color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-15%;z-index:-1;background:var(--mesh);pointer-events:none}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(255,255,255,0) 55%),var(--glass);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);
  border:1px solid var(--glass-edge);box-shadow:var(--glass-hi),var(--glass-shadow)}
@media (prefers-reduced-transparency:reduce){.glass{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:13px 24px;font:600 16px var(--ui);text-decoration:none;cursor:pointer}
.btn.primary{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),var(--accent);color:var(--on-accent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 28px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.ghost{color:var(--fg)}
.btn[aria-disabled="true"]{opacity:.55;cursor:default}

/* Header */
header{position:sticky;top:0;z-index:5;padding:10px 0}
.bar{display:flex;align-items:center;gap:10px;border-radius:999px;padding:6px 6px 6px 8px}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;text-decoration:none;font:700 20px var(--verse)}
.brand svg{width:32px;height:32px}
.bar select{font:500 13px var(--ui);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 10px}
.bar .btn{padding:9px 16px;font-size:14px}
@media (max-width:480px){.brand span{display:none}}

/* Hero */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:56px 0 40px}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding-top:28px;text-align:center}.hero .cta{justify-content:center}}
h1{font:700 clamp(44px,8vw,76px)/1 var(--verse);margin:0 0 14px;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.lead{font-size:clamp(17px,2.2vw,20px);color:var(--muted);margin:0 0 26px;max-width:34ch;text-wrap:pretty}
@media (max-width:820px){.lead{margin-inline:auto}}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:var(--muted)}
@media (max-width:820px){.chips{justify-content:center}}
.chips span{border:1px solid var(--line);border-radius:999px;padding:4px 10px}

/* Phone mock: a verse card and the explanation sheet, as the app shows them */
.phone{width:min(320px,82vw);aspect-ratio:9/18.5;margin:0 auto;border-radius:44px;padding:12px;position:relative}
.screen{position:relative;height:100%;border-radius:34px;overflow:hidden;background:var(--mesh);display:flex;flex-direction:column;justify-content:center;padding:40px 22px 150px}
.screen .ref{font:600 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.screen .vs{font:500 25px/1.3 var(--verse);margin:0 0 16px}
.screen .ask{align-self:flex-start;font:600 13px var(--ui);color:var(--accent);border-radius:999px;padding:7px 14px}
.screen .sheet{position:absolute;left:8px;right:8px;bottom:8px;border-radius:24px;padding:14px 16px;font-size:12.5px;line-height:1.5}
.screen .sheet b{display:block;font:600 10px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.screen .hint{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}

/* Sections */
section{padding:44px 0}
h2{font:700 clamp(30px,5vw,44px)/1.08 var(--verse);margin:0 0 10px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 26px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{border-radius:24px;padding:22px}
.card .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font-size:22px;margin-bottom:12px}
.card h3{font:600 18px var(--ui);margin:0 0 6px}
.card p{margin:0;color:var(--muted);font-size:15px}
.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.lang{border-radius:18px;padding:14px 16px}.lang b{display:block;font-size:16px}.lang span{font-size:13px;color:var(--muted)}
.trust{border-radius:28px;padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:720px){.trust{grid-template-columns:1fr}}
.trust ul{margin:0;padding-left:18px;color:var(--muted)}.trust li{margin:6px 0}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.steps ol{margin:8px 0 0;padding-left:20px;color:var(--muted)}.steps li{margin:4px 0}
.support{border-radius:28px;padding:32px;text-align:center}
.support p{color:var(--muted);max-width:52ch;margin:0 auto 20px}
.support small{display:block;margin-top:10px;color:var(--muted)}
details{border-radius:18px;padding:14px 18px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600;list-style:none}summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--accent);font-size:20px;line-height:1}
details[open] summary::after{content:"–"}
details p{color:var(--muted);margin:10px 0 0}
footer{padding:36px 0 56px;color:var(--muted);font-size:13px}
footer .links{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
footer a{color:var(--fg)}
</style>
