<style>
/* Layout: cover screen with logo + language choice, then a full-height snap feed with a bottom sheet for AI explanations. */
:root{
  --bg:#E9ECE6; --surface:#F6F7F3; --fg:#1C2724; --muted:#5E6B66; --line:#CDD3CC; --accent:#2E5B4E; --on-accent:#F6F7F3; --glow:#C9A44C;
  --verse:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121916; --surface:#1B2420; --fg:#E4E9E4; --muted:#93A29B; --line:#2C3833; --accent:#8CC4AF; --on-accent:#0F1613; --glow:#D9B861; color-scheme:dark;
  --glass:rgba(255,255,255,.07); --glass-strong:rgba(22,32,28,.62); --glass-edge:rgba(255,255,255,.16);
  --glass-sheen:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 45%,rgba(255,255,255,0) 60%,rgba(255,255,255,.06));
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.05);
  --glass-shadow:0 12px 36px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  --mesh:radial-gradient(42% 36% at 12% 18%,rgba(60,140,115,.38),transparent 70%),
         radial-gradient(36% 32% at 88% 12%,rgba(217,184,97,.24),transparent 70%),
         radial-gradient(46% 40% at 76% 86%,rgba(60,120,170,.30),transparent 70%),
         radial-gradient(40% 36% at 8% 92%,rgba(140,196,175,.18),transparent 70%),var(--bg)}}
:root[data-theme="dark"],:root[data-rt="quiet"],:root[data-rt="night"]{--bg:#121916; --surface:#1B2420; --fg:#E4E9E4; --muted:#93A29B; --line:#2C3833; --accent:#8CC4AF; --on-accent:#0F1613; --glow:#D9B861; color-scheme:dark;
  --glass:rgba(255,255,255,.07); --glass-strong:rgba(22,32,28,.62); --glass-edge:rgba(255,255,255,.16);
  --glass-sheen:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.02) 45%,rgba(255,255,255,0) 60%,rgba(255,255,255,.06));
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.05);
  --glass-shadow:0 12px 36px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  --mesh:radial-gradient(42% 36% at 12% 18%,rgba(60,140,115,.38),transparent 70%),
         radial-gradient(36% 32% at 88% 12%,rgba(217,184,97,.24),transparent 70%),
         radial-gradient(46% 40% at 76% 86%,rgba(60,120,170,.30),transparent 70%),
         radial-gradient(40% 36% at 8% 92%,rgba(140,196,175,.18),transparent 70%),var(--bg)}
[hidden]{display:none!important} /* #cover etc. set display:flex, which would otherwise override the hidden attribute */
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden}
button,select{font-family:var(--ui)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cover */
#cover{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center;
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));overflow-y:auto}
.logo{width:112px;height:112px}
#cover h1{font-family:var(--verse);font-weight:700;font-size:clamp(40px,11vw,64px);line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
#cover h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.tag{font-size:16px;line-height:1.5;color:var(--muted);max-width:30ch;margin:0}
.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;width:100%;max-width:420px}
.langs button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.langs button b{font-weight:600;font-size:15px}
.langs button span{font-size:11px;color:var(--muted)}
.langs button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.start{border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;border-radius:999px;padding:14px 32px;cursor:pointer;display:flex;align-items:center;gap:10px}
.start svg{width:18px;height:18px;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-4px)}}

/* Feed */
.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:8px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;border:0;background:none;color:var(--fg);cursor:pointer;padding:0}
.brand svg{width:28px;height:28px}
.brand span{font-family:var(--verse);font-size:21px;font-weight:700}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{font-weight:500;font-size:13px;border:0;background:none;color:var(--muted);padding:6px 11px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
select{font-weight:500;font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:10em}
#lang{max-width:4.6em}
.picker{display:flex;gap:6px;justify-content:center;position:fixed;top:calc(56px + env(safe-area-inset-top,0px));left:0;right:0;z-index:5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.card{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:center;gap:22px;
  padding-block:100px 120px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  max-width:640px;margin:0 auto;cursor:pointer}
.card p{font-family:var(--rfont,var(--verse));font-weight:500;font-size:calc(clamp(26px,6.4vw,38px) * var(--rs,1));line-height:var(--rlh,1.3);text-wrap:pretty;margin:0}
.card p.long{font-size:calc(clamp(21px,5vw,30px) * var(--rs,1))}
.ref{font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hint{font-size:13px;color:var(--muted)}
.ask{align-self:flex-start;font-weight:600;font-size:14px;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:999px;padding:8px 16px;cursor:pointer}
.sum h2{font-family:var(--verse);font-weight:700;font-size:clamp(34px,8vw,48px);line-height:1.05;margin:0}
.sumtext{font-size:18px;line-height:1.6;max-width:60ch;border-left:2px solid var(--glow);padding-left:14px}
@media (max-width:440px){.brand span{display:none}.tabs button{padding:6px 7px;font-size:12px}#lang{display:none}.top{gap:6px}}
#tl{position:fixed;inset:0;box-sizing:border-box;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y;padding-block:calc(70px + env(safe-area-inset-top,0px)) 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
.tlw{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.crumbs button{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:2px 0}
.tlw h2{font-family:var(--verse);font-weight:700;font-size:clamp(30px,7vw,42px);line-height:1.05;margin:0;text-wrap:balance}
.lead{font-size:16px;line-height:1.6;color:var(--muted);margin:0;max-width:62ch}
.rail{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.rail li{position:relative}
.rail li::before{content:"";position:absolute;left:-29px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.node{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.node b{font-size:16px;font-weight:600}.node small{grid-column:1;font-size:12px;color:var(--accent);font-weight:600;letter-spacing:.04em}
.node span{grid-column:1;font-size:13px;color:var(--muted);line-height:1.45}
.node i{grid-row:1/4;grid-column:2;font-style:normal;color:var(--muted);font-size:20px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.fact{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.fact small{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.fact b{font-size:15px}
.dl{display:flex;flex-direction:column;gap:10px;margin:0}.dl div{display:flex;flex-direction:column;gap:2px}.dl dt{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.dl dd{margin:0;font-size:16px;line-height:1.5}
.go{align-self:flex-start;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:15px;border-radius:999px;padding:11px 20px;cursor:pointer}
.map{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow-x:auto}
.map svg{display:block;width:100%;min-width:340px;height:auto}
.map .sea{fill:color-mix(in srgb,var(--accent) 16%,var(--surface))}.map .land{fill:color-mix(in srgb,var(--bg) 70%,transparent);stroke:var(--line)}
.map .river{fill:none;stroke:color-mix(in srgb,var(--accent) 45%,transparent);stroke-width:2}
.map .pt{fill:var(--glow);stroke:var(--fg);stroke-width:1}.map text{fill:var(--fg);font:600 11px var(--ui)}.map .soft{fill:var(--muted);font-weight:500;font-style:italic}
.map .route{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 4}
.cap{font-size:12px;color:var(--muted);padding:8px 12px}
/* Horizontal timeline: full-bleed, positions in % of track height so it fits any screen */
.tlbox{width:100vw;margin-left:calc(50% - 50vw);display:flex;flex-direction:column;gap:10px}
.tlbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.zgrp{display:flex;gap:6px;margin-left:auto}
.zgrp button{height:38px;min-width:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:19px;line-height:1;cursor:pointer;padding:0 12px}
.zgrp #zFit{font-size:13px;font-weight:600}.zgrp button:disabled{opacity:.4;cursor:default}
/* --z scales the horizontal axis only (cards keep their size), so the axis stays in the vertical middle at every zoom */
.hscroll{--ax:calc(50% + 27px);--cw:200px;--z:1;height:clamp(560px,80vh,700px);overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x}
.htrack{position:relative;height:100%;width:calc(var(--w) * var(--z));margin-inline:auto}
/* Level of detail: "mid" = titles only, "dots" = the whole Bible at a glance */
.hscroll[data-lod="mid"],.hscroll[data-lod="dots"]{scroll-snap-type:none}
.hscroll[data-lod="mid"]{--cw:120px}
.hscroll[data-lod="mid"] .hc :is(img,span,small){display:none}.hscroll[data-lod="mid"] .hc{padding:7px 9px}.hscroll[data-lod="mid"] .hc b{font-size:12px}
.hscroll[data-lod="dots"] :is(.hc,.yr,.stem){display:none}
.hscroll[data-lod="dots"] .dot{width:7px;height:7px;left:-4.5px;margin-top:-4.5px;border-width:1px;box-shadow:0 0 0 1px var(--accent)}
.hscroll[data-lod="dots"] .seg{height:calc(var(--ax) - 24px);align-items:flex-start;justify-content:center;padding-top:10px;cursor:zoom-in}
.hscroll[data-lod="dots"] .segl{position:static;padding:0;writing-mode:vertical-rl;max-width:none;max-height:100%}
.hscroll[data-lod="dots"] .segl span{font-size:15px}.hscroll[data-lod="dots"] .segl small{display:none}
.hscroll[data-lod="mid"] .seg{cursor:zoom-in}
.hci{display:block;width:calc(100% + 24px);margin:-10px -12px 4px;height:84px;object-fit:cover;border-radius:11px 11px 0 0;filter:sepia(.15)}
.evfig{margin:0;display:flex;flex-direction:column;gap:6px}
.evfig img{width:100%;max-height:52vh;object-fit:contain;background:var(--surface);border-radius:12px;border:1px solid var(--line)}
.evfig figcaption{font-size:12px;color:var(--muted)}
.band{position:absolute;top:0;bottom:0}
.band.b0{background:color-mix(in srgb,var(--accent) 6%,transparent)}.band.b1{background:color-mix(in srgb,var(--glow) 9%,transparent)}
.seg{position:absolute;top:0;height:54px;box-sizing:border-box;overflow:hidden;border-right:1px solid var(--glass-edge);display:flex;align-items:center}
.seg.s0{background:color-mix(in srgb,var(--accent) 22%,transparent)}.seg.s1{background:color-mix(in srgb,var(--glow) 26%,transparent)}
.segl{position:sticky;left:12px;padding:0 12px;display:flex;flex-direction:column;gap:1px;min-width:0;max-width:calc(100vw - 40px)}
.segl span{font-family:var(--verse);font-weight:700;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segl small{font-size:11px;font-weight:600;color:var(--fg);opacity:.75;white-space:nowrap}
.axis{position:absolute;left:0;right:0;top:var(--ax);height:2px;margin-top:-1px;background:var(--fg);opacity:.35}
.hev{position:absolute;top:0;width:0;height:100%;border:0;background:none;padding:0;cursor:pointer;color:var(--fg);scroll-snap-align:center}
.hev .dot{position:absolute;top:var(--ax);left:-7px;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--glow);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--accent)}
.hev .stem{position:absolute;left:-1px;width:2px;background:var(--accent);opacity:.6;height:44px}
.hev.up .stem{top:calc(var(--ax) - 52px)}.hev.down .stem{top:calc(var(--ax) + 8px)}
.hev .yr{position:absolute;left:0;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--accent);white-space:nowrap;background:var(--bg);padding:1px 6px;border-radius:999px}
.hev.up .yr{top:calc(var(--ax) + 12px)}.hev.down .yr{top:calc(var(--ax) - 30px)}
.hev .hc{position:absolute;left:0;transform:translateX(-50%);width:var(--cw);text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;transition:transform .15s,border-color .15s}
.hev.up .hc{bottom:calc(100% - var(--ax) + 52px)}.hev.down .hc{top:calc(var(--ax) + 52px)}
.hev:hover .hc,.hev:focus-visible .hc{border-color:var(--accent);transform:translateX(-50%) translateY(-2px)}
.hev:focus-visible{outline:none}
.hc b{font-size:14px;font-weight:600;line-height:1.25}.hc span{font-size:12px;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.hc small{font-size:11px;font-weight:600;color:var(--accent)}
@media (max-width:480px){.hscroll{--cw:164px}.segl span{font-size:16px}.hci{height:70px}}
@media (max-height:640px){.hci{display:none}}
@media (max-height:520px){.hc span{display:none}}
.fsbtn{border:1px solid var(--accent);background:none;color:var(--accent);font-weight:600;font-size:14px;border-radius:999px;padding:8px 14px;cursor:pointer}
.fsclose{display:none}
.tlbox.full{position:fixed;inset:0;z-index:30;width:auto;margin:0;background:var(--bg);box-sizing:border-box;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.tlbox.full .hscroll{flex:1;height:auto;min-height:0}.tlbox.full .htrack{min-height:380px}.tlbox.full .fsbtn{display:none}
.tlbox.full .fsclose{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:16px;cursor:pointer}
body.fs .top{display:none}
.eras{display:flex;flex-wrap:wrap;gap:6px}.eras button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.hev .hc{transition:none}}
#prog{position:fixed;inset:0;box-sizing:border-box;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-block:calc(70px + env(safe-area-inset-top,0px)) 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card[data-v]::after{content:"✓";position:absolute;right:max(24px,env(safe-area-inset-right,0px));bottom:110px;font-size:13px;font-weight:700;color:var(--accent);opacity:0;transition:opacity .4s}
.card.seen::after{opacity:.8}
.chst{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.chst .done{color:var(--accent);font-weight:700}
.chst button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer}
.evnav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.evnav span{font-size:12px;color:var(--muted)}
.evnav button:not(.go){border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
.evnav button:disabled{opacity:.4;cursor:default}
.pbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent);min-width:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:6px}
.testa{font-family:var(--verse);font-size:24px;margin:8px 0 0}
.pbook{display:flex;flex-direction:column;gap:6px}
.pbh{display:flex;justify-content:space-between;align-items:baseline}.pbh b{font-size:14px}.pbh small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cgrid{display:flex;flex-wrap:wrap;gap:4px}
.sq{width:16px;height:16px;border-radius:4px;border:1px solid var(--line);background:var(--surface);padding:0;cursor:pointer;display:inline-block;box-sizing:border-box}
.sq.part{background:color-mix(in srgb,var(--accent) 40%,var(--surface));border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.sq.full{background:var(--accent);border-color:var(--accent)}
button.sq:hover{outline:2px solid var(--glow);outline-offset:1px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.vsq{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.vsq.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
/* Reader themes: override the base tokens when chosen */
:root[data-rt="original"]{--bg:#FFFFFF;--surface:#F4F4F2;--fg:#1A1A1A;--muted:#6B6B6B;--line:#E2E2DE;--accent:#2E5B4E;--on-accent:#FFFFFF;--glow:#C9A44C;color-scheme:light}

/* ===== Liquid glass theme =====
   Translucent, blurred panels with a bright top edge, floating over a soft colour mesh.
   Overrides the base styles above; tokens adapt to light/dark like the rest of the palette.
   Light reading themes (Aa) force the light glass even when the phone is in dark mode, so their dark
   text never lands on dark glass; dark reading themes join the dark token block at the top. */
:root,:root[data-rt="original"],:root[data-rt="paper"],:root[data-rt="bold"],:root[data-rt="calm"]{
  --glass:rgba(255,255,255,.44); --glass-strong:rgba(255,255,255,.68); --glass-edge:rgba(255,255,255,.8);
  --glass-sheen:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 45%,rgba(255,255,255,0) 60%,rgba(255,255,255,.18));
  --glass-hi:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.3);
  --glass-shadow:0 10px 34px rgba(24,48,40,.14),0 2px 6px rgba(24,48,40,.06);
  --blur:blur(22px) saturate(185%);
  --mesh:radial-gradient(42% 36% at 12% 18%,rgba(46,91,78,.34),transparent 70%),
         radial-gradient(36% 32% at 88% 12%,rgba(201,164,76,.40),transparent 70%),
         radial-gradient(46% 40% at 76% 86%,rgba(72,138,168,.30),transparent 70%),
         radial-gradient(40% 36% at 8% 92%,rgba(140,196,175,.45),transparent 70%),var(--bg);
}
/* Dark values of these tokens are with the other dark tokens at the top. */

/* Background: a slowly drifting colour mesh behind everything */
body::before{content:"";position:fixed;inset:-15%;z-index:-1;background:var(--mesh);animation:drift 40s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{to{transform:translate3d(4%,-3%,0) rotate(6deg) scale(1.06)}}
#cover,.tlbox.full{background:var(--mesh)}
#cover{background-attachment:fixed}

/* Shared glass surface */
.tabs,select,.langs button,.ask,.sheet,.node,.fact,.map,.hev .hc,.eras button,.fsbtn,.tlbox.full .fsclose,.hev .yr,.card::before,.sheet button,.brand{
  background:var(--glass-sheen),var(--glass);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-edge);box-shadow:var(--glass-hi),var(--glass-shadow)}
.hev .yr,.sheet button{box-shadow:var(--glass-hi)}

/* Floating controls: no solid bar, content scrolls under the glass pills */
/* Soft frosted fade behind the floating controls so scrolled text never collides with them */
.top::before{content:"";position:absolute;inset:0 0 -16px;z-index:-1;pointer-events:none;
  background:color-mix(in srgb,var(--bg) 40%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.brand{border-radius:999px;padding:4px 12px 4px 4px}
@media (max-width:440px){.brand{padding:4px}}
.tabs{padding:4px}
.tabs button{transition:background .2s,color .2s}
.tabs button[aria-pressed="true"]{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0)),var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 8px color-mix(in srgb,var(--accent) 40%,transparent)}
select{border-radius:999px;padding:7px 12px;appearance:none;-webkit-appearance:none;text-align:center}

/* Cover */
.langs button{border-radius:18px;padding:12px 14px;transition:transform .15s}
.langs button:hover{transform:translateY(-1px)}
.langs button[aria-pressed="true"]{border-color:color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:var(--glass-hi),inset 0 0 0 1px var(--accent),var(--glass-shadow)}
.start,.go{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 55%),var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 60%,white);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 28px color-mix(in srgb,var(--accent) 40%,transparent)}
.logo{filter:drop-shadow(0 12px 28px color-mix(in srgb,var(--accent) 45%,transparent))}

/* Feed: each verse sits on its own glass pane */
.card{position:relative;isolation:isolate}
.card::before{content:"";position:absolute;inset:84px 10px 96px;z-index:-1;border-radius:32px;pointer-events:none}
.ask{border-color:var(--glass-edge);padding:9px 18px}

/* Bottom sheet floats as a glass panel */
.sheet{background:var(--glass-sheen),var(--glass-strong)}

/* History */
.node,.fact,.map{border-radius:18px}
.hev .hc{border-radius:16px}

/* Accessibility and fallbacks */
@media (prefers-reduced-motion:reduce){body::before{animation:none}.langs button{transition:none}}
/* Fallbacks swap the tokens, so they cover every glass surface. Selectors match the dark blocks' weight. */
@media (prefers-reduced-transparency:reduce){:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
  --glass:var(--surface);--glass-strong:var(--surface);--glass-sheen:none;--blur:none}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--glass:var(--glass-strong)}}
</style>

   ${ids.map(id=>{const p=pos[id],w=Math.max(54,PP[id].n.length*6.6+16);return `<g class="mn" data-pp="${id}" tabindex="0"><rect x="${(p.x-w/2).toFixed(1)}" y="${(p.y-13).toFixed(1)}" width="${w.toFixed(0)}" height="26" rx="13"/><text x="${p.x.toFixed(1)}" y="${(p.y+4).toFixed(1)}" text-anchor="middle">${esc(PP[id].n)}</text></g>`}).join("")}
  </svg>`}
/* Capítulos por época y secciones de cada acontecimiento */
const ERA_CH=[[[0,1,11]],[[0,12,50],[17,1,42]],[[1,1,40],[2,1,27],[3,1,36],[4,1,34]],[[5,1,24],[6,1,21],[7,1,4]],
 [[8,1,31],[9,1,24],[10,1,11],[12,1,29],[13,1,9],[18,1,150],[19,1,31],[20,1,12],[21,1,8]],
 [[10,12,22],[11,1,25],[13,10,36],[22,1,66],[23,1,52],[24,1,5],[27,1,14],[28,1,3],[29,1,9],[30,1,1],[31,1,4],[32,1,7],[33,1,3],[34,1,3],[35,1,3]],
 [[25,1,48],[26,1,12],[14,1,10],[15,1,13],[16,1,10],[36,1,2],[37,1,14],[38,1,4]],
 [[39,1,28],[40,1,16],[41,1,24],[42,1,21]],
 Array.from({length:23},(_,i)=>[43+i,1,null])];
function eraChaptersHTML(ei){return ERA_CH[ei].map(([b,from,to])=>{const n=B?B[b][1].length:to||1;to=to||n;to=Math.min(to,n);
  const done=Array.from({length:to-from+1},(_,i)=>B&&chapFrac(b,from+i-1)>=1).filter(Boolean).length;
  return `<section class="pbook"><div class="pbh"><b>${esc(bookName(b))}${from>1||to<n?` ${from}–${to}`:""}</b><small>${done}/${to-from+1}</small></div>${chapGrid(b,from,to)}</section>`}).join("")}
/* Numbered chapter squares (1-based from..to), coloured by reading progress */
const sqCls=f=>f>=1?"full":f>0?"part":"";
function chapGrid(b,from,to){let h="";for(let c=from;c<=to;c++)h+=`<button class="sq lbl ${B?sqCls(chapFrac(b,c-1)):""}" data-rc="${b},${c}" aria-label="${esc(bookName(b))} ${c}">${c}</button>`;return `<div class="cgrid big">${h}</div>`}
function evSection(ei,vi){const ev=TL[ei].e[vi],b=ev.r[0];let to=B?B[b][1].length:ev.r[1];
  const L=EVL;for(const [a,c] of L){const e2=TL[a].e[c];if(e2.r[0]===b&&e2.r[1]>ev.r[1])to=Math.min(to,e2.r[1]-1)}
  const era=ERA_CH[ei].find(x=>x[0]===b);if(era&&era[2])to=Math.min(to,era[2]);
  let from=ev.r[1];const first=L.filter(([a,c])=>TL[a].e[c].r[0]===b).sort((x,y)=>TL[x[0]].e[x[1]].r[1]-TL[y[0]].e[y[1]].r[1])[0];
  if(first&&first[0]===ei&&first[1]===vi&&era)from=era[1];return {b,from,to:Math.max(from,to)}}
/* Imagen de personaje: grabado de un acontecimiento donde aparece */
const ppImgCache=new Map();
function ppImg(id){if(!ppImgCache.has(id))ppImgCache.set(id,findPpImg(id));return ppImgCache.get(id)}
function findPpImg(id){if((window.PPIMG||{})[id])return PPIMG[id].src;const n=PP_ES[id].n.split(" (")[0],I=window.TLIMG||{};for(let ei=0;ei<TL_ES.length;ei++)for(let vi=0;vi<TL_ES[ei].e.length;vi++){const ev=TL_ES[ei].e[vi];if(I[ei+","+vi]&&ev.p.some(x=>x.split("/")[0].startsWith(n)||x.includes(n)))return I[ei+","+vi].src}return null}
const ES_BOOKS=["Génesis","Éxodo","Levítico","Números","Deuteronomio","Josué","Jueces","Rut","1 Samuel","2 Samuel","1 Reyes","2 Reyes","1 Crónicas","2 Crónicas","Esdras","Nehemías","Ester","Job","Salmos","Proverbios","Eclesiastés","Cantares","Isaías","Jeremías","Lamentaciones","Ezequiel","Daniel","Oseas","Joel","Amós","Abdías","Jonás","Miqueas","Nahúm","Habacuc","Sofonías","Hageo","Zacarías","Malaquías","Mateo","Marcos","Lucas","Juan","Hechos","Romanos","1 Corintios","2 Corintios","Gálatas","Efesios","Filipenses","Colosenses","1 Tesalonicenses","2 Tesalonicenses","1 Timoteo","2 Timoteo","Tito","Filemón","Hebreos","Santiago","1 Pedro","2 Pedro","1 Juan","2 Juan","3 Juan","Judas","Apocalipsis"];
const bookName=i=>B?B[i][0]:ES_BOOKS[i];

/* Navegación entre acontecimientos y capítulos */
const evIndex=(a,b)=>EVI[a+","+b]??-1;
function goEv(d){if(!isEvPath())return;const i=evIndex(tlPath[0],tlPath[1])+d;if(i<0||i>=EVL.length)return;tlPath=EVL[i];renderTL()}
/* Chapter d steps from b:c (0-based), crossing book boundaries; null past either end of the Bible */
function chapAt(b,c,d){c+=d;if(c<0){if(b===0)return null;b--;c=B[b][1].length-1}else if(c>=B[b][1].length){if(b===B.length-1)return null;b++;c=0}return [b,c]}
/* Select book b, chapter c (0-based), remember it, then show it (default: switch to Read) */
function openChap(b,c,show=()=>setMode("read")){if(!B)return;$("book").value=b;fillChaps();$("chap").value=c;savePos();show()}
function goChap(d){if(!B)return;const n=chapAt(+$("book").value,+$("chap").value,d);if(n)openChap(n[0],n[1],showRead)}
function onSwipe(el,fn){let x0=null,y0,t0;
  el.addEventListener("touchstart",e=>{if(e.touches.length>1){x0=null;return}const t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now()},{passive:true});
  el.addEventListener("touchend",e=>{if(x0==null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6&&Date.now()-t0<900)fn(dx<0?1:-1)},{passive:true})}
onSwipe(feed,d=>{if(mode!=="read")return;if(RS.mode==="paged")turnPage(d);else goChap(d)});
const isEvPath=()=>tlPath.length===2&&typeof tlPath[0]==="number"&&tlPath[0]>=0;
onSwipe($("tl"),d=>{if(mode==="hist"&&isEvPath())goEv(d)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeSheet();closeRS();return}
  if(e.target.closest("select,input,textarea"))return;
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;const d=e.key==="ArrowRight"?1:-1;
  if(mode==="read"){RS.mode==="paged"?turnPage(d):goChap(d)}else if(mode==="hist"&&isEvPath())goEv(d)});

/* Seguimiento de lectura: un versículo cuenta como leído tras ~1 s visible */
const RD=store.get("rd",{});let rdT=null;
const rdSave=()=>{clearTimeout(rdT);rdT=setTimeout(()=>store.set("rd",RD),300)};
function isRead(b,c,v){const s=RD[b+":"+c];return !!s&&s[v]==="1"}
function chapFrac(b,c){const s=RD[b+":"+c];if(!s)return 0;const n=B?B[b][1][c].length:s.length;let r=0;for(const x of s)if(x==="1")r++;return Math.min(1,r/n)}
/* Set verse v read (on) or unread; returns whether it changed */
function markRead(b,c,v,on=true){const k=b+":"+c,n=B[b][1][c].length,s=(RD[k]||"").padEnd(n,"0"),x=on?"1":"0";if(s[v]===x)return false;RD[k]=s.slice(0,v)+x+s.slice(v+1);rdSave();return true}
function markChap(b,c,on){RD[b+":"+c]=(on?"1":"0").repeat(B[b][1][c].length);store.set("rd",RD)}
/* A verse card or span counts as read after it stays visible for `ms` */
function seenV(el){const b=+el.dataset.b,c=+el.dataset.c,v=+el.dataset.v;if(!markRead(b,c,v))return;el.classList.add("seen");
  if(mode!=="read")return;feed.querySelector(".sum")?._paint?.();if(chapFrac(b,c)>=1){fillChaps();$("chap").value=c}}
const mkObs=(root,ms,threshold)=>"IntersectionObserver" in window?new IntersectionObserver(es=>{for(const en of es){const el=en.target;
  if(en.isIntersecting)el._t=setTimeout(()=>seenV(el),ms);else clearTimeout(el._t)}},{root,threshold}):{observe(){},disconnect(){}};
const vObs=mkObs(feed,1000,.6),sObs=mkObs(feed,1500,.9);

/* Vista de progreso */
let progSel=null;
function renderProg(){const box=$("prog");
  if(!B){box.innerHTML=`<div class="loading">${T("loading")}</div>`;return}
  const F=B.map((bk,b)=>bk[1].map((_,c)=>chapFrac(b,c)));
  let tv=0,rv=0,tc=0,rc=0;B.forEach((bk,b)=>bk[1].forEach((ch,c)=>{const f=F[b][c];tv+=ch.length;tc++;rv+=Math.round(f*ch.length);if(f>=1)rc++}));
  const pct=x=>(x*100).toFixed(x>0&&x<.01?2:1).replace(/\.0$/,"");
  let h="";
  if(progSel){const [b,c]=progSel,ch=B[b][1][c],n=ch.length,r=Math.round(chapFrac(b,c)*n);
    h=`<nav class="crumbs"><button data-pback>${tr("Progreso")}</button> › ${esc(B[b][0])} ${c+1}</nav>
    <h2>${esc(B[b][0])} ${c+1}</h2><p class="lead">${tr("{0} de {1} versículos leídos.",r,n)}</p>
    <div class="vgrid">${ch.map((_,v)=>`<button class="vsq ${isRead(b,c,v)?"on":""}" data-vv="${v}" title="${tr("Versículo {0}",v+1)}">${v+1}</button>`).join("")}</div>
    <p class="note">${tr("Toca un versículo para marcarlo o desmarcarlo.")}</p>
    <div class="evnav"><button class="go" id="pRead">${tr("Leer")} ${esc(B[b][0])} ${c+1} →</button><button id="pAll">${r>=n?tr("Marcar como no leído"):tr("Marcar todo como leído")}</button></div>`;
  }else{
    h=`<h2>${tr("Tu progreso")}</h2>
    <div class="facts"><div class="fact"><small>${tr("Biblia leída")}</small><b>${pct(rv/tv)}%</b></div><div class="fact"><small>${tr("Capítulos completos")}</small><b>${rc} / ${tc}</b></div><div class="fact"><small>${tr("Versículos leídos")}</small><b>${rv.toLocaleString(lang)} / ${tv.toLocaleString(lang)}</b></div></div>
    <div class="pbar"><i style="width:${(rv/tv*100).toFixed(2)}%"></i></div>
    <div class="legend"><span><i class="sq"></i> ${tr("Sin leer")}</span><span><i class="sq part"></i> ${tr("En curso")}</span><span><i class="sq full"></i> ${tr("Leído")}</span></div>
    <p class="note">${tr("Cada cuadrado es un capítulo. Toca uno para ver sus versículos. El progreso se guarda en este navegador.")}</p>`;
    B.forEach((bk,b)=>{if(b===0)h+=`<h3 class="testa">${tr("Antiguo Testamento")}</h3>`;if(b===39)h+=`<h3 class="testa">${tr("Nuevo Testamento")}</h3>`;
      const done=F[b].filter(f=>f>=1).length;
      h+=`<section class="pbook"><div class="pbh"><b>${esc(bk[0])}</b><small>${done}/${bk[1].length}</small></div><div class="cgrid">${bk[1].map((_,c)=>`<button class="sq ${sqCls(F[b][c])}" data-pc="${b},${c}" title="${esc(bk[0])} ${c+1}" aria-label="${esc(bk[0])} ${c+1}"></button>`).join("")}</div></section>`});
  }
  box.innerHTML=`<div class="tlw">${h}</div>`;
  box.querySelectorAll("[data-pc]").forEach(x=>x.onclick=()=>{progSel=x.dataset.pc.split(",").map(Number);renderProg();box.scrollTop=0});
  const bk=box.querySelector("[data-pback]");if(bk)bk.onclick=()=>{progSel=null;renderProg()};
  box.querySelectorAll("[data-vv]").forEach(x=>x.onclick=()=>{const [b,c]=progSel,v=+x.dataset.vv;markRead(b,c,v,!isRead(b,c,v));renderProg()});
  const pr=$("pRead");if(pr)pr.onclick=()=>openChap(...progSel);
  const pa=$("pAll");if(pa)pa.onclick=()=>{const [b,c]=progSel;markChap(b,c,chapFrac(b,c)<1);renderProg()};
}
feed.addEventListener("scroll",()=>{if(mode==="for"&&feed.scrollTop+feed.clientHeight*3>feed.scrollHeight)more()});

/* Ajustes de lectura (tipo Libros de iOS) */
const THEMES=[["auto","Automático"],["original","Original"],["quiet","Tranquilo"],["paper","Papel"],["bold","Intenso"],["calm","Sereno"],["night","Noche"]];
const FONTS=[["cormorant","Clásica",'"Cormorant Garamond",Georgia,serif'],["lora","Libro",'Lora,Georgia,serif'],["figtree","Moderna",'Figtree,system-ui,sans-serif'],["atkinson","Legible",'"Atkinson Hyperlegible",Verdana,sans-serif']];
const RS=Object.assign({mode:"verse",theme:"auto",font:"cormorant",size:1,lh:1.4},store.get("rs",{}));
function applyRS(){const r=document.documentElement;
  if(RS.theme==="auto")r.removeAttribute("data-rt");else r.setAttribute("data-rt",RS.theme);
  const f=FONTS.find(x=>x[0]===RS.font)||FONTS[0];r.style.setProperty("--rfont",f[2]);
  r.style.setProperty("--rs",RS.size);r.style.setProperty("--rlh",RS.lh);
  document.querySelectorAll("#rMode [data-m]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===RS.mode));
  document.querySelectorAll("#rTheme [data-t]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===RS.theme));
  document.querySelectorAll("#rFont [data-f]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.f===RS.font));
  document.querySelectorAll("#rLh [data-l]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.l===+RS.lh));
  $("rSize").value=RS.size;store.set("rs",RS)}
function paintRS(){const vs=versOf(lang);$("rVerWrap").hidden=vs.length<2;
$("rVer").innerHTML=vs.map(v=>`<button data-v="${v.d}" aria-pressed="${v.d===dk(lang)}">${esc(v.ver)}</button>`).join("");
$("rTheme").innerHTML=THEMES.map(([k,n])=>`<button data-t="${k}" class="th th-${k}"><i>Aa</i><span>${esc(tr(n))}</span></button>`).join("");
$("rFont").innerHTML=FONTS.map(([k,n,ff])=>`<button data-f="${k}" style="font-family:${ff.replace(/"/g,"&quot;")}">${esc(tr(n))}</button>`).join("");
if(typeof RS!=="undefined")applyRS()}
paintRS();
let relayout=null;const rerender=()=>{clearTimeout(relayout);relayout=setTimeout(()=>{if(mode==="read"&&B){const sp=pageIdx;showRead();if(RS.mode==="paged")setTimeout(()=>goPage(sp),30)}},120)};
$("rMode").onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;RS.mode=b.dataset.m;applyRS();if(mode!=="read")setMode("read");else showRead()};
$("rVer").onclick=e=>{const b=e.target.closest("[data-v]");if(!b||b.dataset.v===dk(lang))return;
  store.set("ver_"+lang,b.dataset.v);buildLangUI();paintRS();useLang(lang)};
$("rTheme").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;RS.theme=b.dataset.t;applyRS()};
$("rFont").onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;RS.font=b.dataset.f;applyRS();if(RS.mode==="paged")rerender()};
$("rLh").onclick=e=>{const b=e.target.closest("[data-l]");if(!b)return;RS.lh=+b.dataset.l;applyRS();if(RS.mode==="paged")rerender()};
$("rSize").oninput=e=>{RS.size=+e.target.value;applyRS();if(RS.mode==="paged")rerender()};
function openRS(){$("rsheet").hidden=false;$("scrim").hidden=false}
function closeRS(){$("rsheet").hidden=true;if($("sheet").hidden)$("scrim").hidden=true}
$("aa").onclick=()=>$("rsheet").hidden?openRS():closeRS();$("rClose").onclick=closeRS;
applyRS();

/* Capítulo completo y páginas */
let pageIdx=0,pager=null;
function chapterBody(b,c){const p=document.createElement("div");p.className="ctext";
  B[b][1][c].forEach((t,v)=>{const s=document.createElement("span");s.className="vs"+(isRead(b,c,v)?" seen":"");s.dataset.b=b;s.dataset.c=c;s.dataset.v=v;
    s.innerHTML=`<sup>${v+1}</sup>`;s.appendChild(document.createTextNode(t+" "));s.onclick=()=>explain(b,c,v);p.appendChild(s)});return p}
function showFlow(){const b=+$("book").value,c=+$("chap").value;clearFeed();feed.className=RS.mode;
  const sum=summaryCard(b,c);sum.className="sum flowsum";
  const nb=chapAt(b,c,1);
  const end=document.createElement("div");end.className="flowend";
  if(nb){end.innerHTML=`<button class="go"></button>`;end.firstChild.textContent=`${T("next")}: ${B[nb[0]][0]} ${nb[1]+1} →`;end.firstChild.onclick=()=>goChap(1)}
  if(RS.mode==="flow"){const art=document.createElement("article");art.className="flowc";art.append(sum,chapterBody(b,c),end);feed.appendChild(art);feed.scrollTop=0;
    art.querySelectorAll(".vs").forEach(s=>sObs.observe(s))}
  else{const wrap=document.createElement("div");wrap.className="pwrap";const cols=document.createElement("div");cols.className="pcols";
    cols.append(sum,chapterBody(b,c),end);wrap.appendChild(cols);const ind=document.createElement("div");ind.className="pind";feed.append(wrap,ind);pager={wrap,cols,ind,obs:mkObs(wrap,1500,.9)};pageIdx=0;
    wrap.addEventListener("click",e=>{if(e.target.closest("button,.vs"))return;const x=e.clientX/wrap.clientWidth;if(x>.66)turnPage(1);else if(x<.33)turnPage(-1)});
    const pg=pager;requestAnimationFrame(()=>{goPage(0);cols.querySelectorAll(".vs").forEach(s=>pg.obs.observe(s))})}}
function pages(){return pager?Math.max(1,Math.round(pager.cols.scrollWidth/pager.wrap.clientWidth)):1}
function goPage(i){if(!pager)return;pageIdx=Math.max(0,Math.min(pages()-1,i));pager.wrap.scrollTo({left:pageIdx*pager.wrap.clientWidth,behavior:"auto"});pager.ind.textContent=`${pageIdx+1} / ${pages()}`}
function turnPage(d){if(!pager)return goChap(d);const n=pages();if(pageIdx+d<0){goChap(-1);return}if(pageIdx+d>=n){goChap(1);return}goPage(pageIdx+d)}
addEventListener("resize",()=>{if(mode==="read"&&RS.mode==="paged")rerender()});

const aiErr=(e,fallback)=>e?.code==="not_granted"?T("grant"):e?.code==="rate_limited"?T("rate"):fallback;
async function getSample(){if(sampleFn===undefined){try{sampleFn=(await window.claude?.use?.("sample"))??null}catch(e){sampleFn=null}}return sampleFn}
async function explain(b,c,v){
  const t=B[b][1][c][v];$("sRef").textContent=ref(b,c,v);$("sText").textContent=t;
  $("exp").textContent=T("think");$("sheet").hidden=$("scrim").hidden=false;
  ctrl?.abort();ctrl=null;const id=++expReq; // stop any live answer still streaming for a previous verse
  const pre=(await iaBook(dk(lang),b))?.exp?.[`${c}:${v}`];
  if(id!==expReq)return; // user opened another verse meanwhile
  if(pre){$("exp").textContent=pre;return}
  const s=await getSample();if(id!==expReq)return;if(!s){$("exp").textContent=T(navigator.onLine?"noai":"offline");return}
  ctrl=new AbortController();
  const ch=B[b][1][c],prev=ch.slice(Math.max(0,v-2),v).join(" "),next=ch.slice(v+1,v+3).join(" "),P=T("p");
  const prompt=`You are a warm, clear, non-denominational Christian Bible teacher. Explain this verse from the ${T("ver")} translation. Write ONLY in ${T("pl")}.
Verse (${ref(b,c,v)}): "${t}"
Previous context: "${prev}"
Following context: "${next}"
Plain text, no markdown, at most 130 words, three short parts separated by a blank line:
1) ${P[0]}.
2) ${P[1]}.
3) ${P[2]}.
Do not invent historical facts; if something is uncertain or interpreted in several ways, say so.`;
  try{const r=await s(prompt,{signal:ctrl.signal,modelTier:"quick",onText:({text})=>{$("exp").textContent=text}});$("exp").textContent=r.text}
  catch(e){if(e?.name==="AbortError")return;
    $("exp").textContent=aiErr(e,e?.text||T("err"))}
}
function closeSheet(){expReq++;ctrl?.abort();$("sheet").hidden=$("scrim").hidden=true}
$("close").onclick=closeSheet;$("scrim").onclick=()=>{closeSheet();closeRS()};
$("tFor").onclick=()=>setMode("for");$("tRead").onclick=()=>setMode("read");$("tHist").onclick=()=>{tlPath=[];setMode("hist")};$("tProg").onclick=()=>{progSel=null;setMode("prog")};
$("book").onchange=()=>{fillChaps();showRead();savePos()};$("chap").onchange=()=>{showRead();savePos()};
$("lang").onchange=e=>useLang(e.target.value);
$("start").onclick=()=>{$("cover").hidden=true;useLang(lang)};
$("home").onclick=()=>{closeSheet();$("cover").hidden=false};

/* Offline support. Fails quietly where service workers aren't allowed (e.g. inside a claude.ai artifact). */
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
buildLangUI();lang=store.get("lang",guessLang());if(!L[lang])lang="es";paintText();load(dk(lang)).catch(()=>{});
</script>
